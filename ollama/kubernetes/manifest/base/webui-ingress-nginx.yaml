apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: open-webui
  annotations:
    kubernetes.io/ingress.class: nginx # (Optional) Traditional annotation
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Correct format for setting multiple headers:
    nginx.ingress.kubernetes.io/proxy-set-headers: "upgrade: $http_upgrade, connection: upgrade"
spec:
  ingressClassName: nginx # Moved from annotations to the spec section
  rules:
  - host: 192.168.1.20.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui-service
            port:
              number: 8080
